<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Tenfold — Ledger</title>
  <link rel="icon" href="../../dist/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../fonts/ibm-plex-sans-condensed.css">
  <link rel="stylesheet" href="../shared/widgets.css">
  <link rel="stylesheet" href="../shared/ledger-view.css">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="./">Tenfold</a>
    <a class="credits" href="../../dist/credits.html">Sources and licences</a>
  </header>
  <main class="sheet ledger">
    <div class="sheet-head">
      <h1>
        <span>Estimated impact over</span>
        <span class="period">
          <input id="horizon-amount" type="number" min="1" max="1000" step="1" inputmode="numeric" aria-label="Period length">
          <select id="horizon-unit" aria-label="Period unit"></select>
        </span>
      </h1>
      <div class="tools">
        <label id="grid-field" class="grid-field" hidden>Electricity grid <select id="grid"></select></label>
        <button type="button" id="add" class="add">Add activity <kbd>/</kbd></button>
      </div>
    </div>
    <div class="scroll" id="scroll" role="region" aria-label="Impact ledger" tabindex="0">
      <table id="ledger"></table>
    </div>
    <ul class="notes" id="notes"></ul>
  </main>
</body>
</html>
